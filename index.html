<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <link rel="icon" href="logo-light.png" id="favicon" />
        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
        <link rel="manifest" href="manifest.webmanifest" />
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

            href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
            rel="stylesheet"
        />
        <!-- Filled Icons -->
        <link
            href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css"
            rel="stylesheet"
        />
        <!-- Brand Icons -->
        <link
            href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css"
            rel="stylesheet"
        />

        <!-- Favicon manager based on theme -->
        <script>
            (function () {
                const favicon = document.getElementById("favicon");
                const darkQuery = window.matchMedia(
                    "(prefers-color-scheme: dark)",
                );

                function updateFavicon() {
                    favicon.href = darkQuery.matches
                        ? "logo-dark.png"
                        : "logo-light.png";
                }

                updateFavicon();
                darkQuery.addEventListener("change", updateFavicon);
            })();
        </script>
      <script type="module" crossorigin src="/portfolio/assets/index-CjaHtPNU.js"></script>
      <link rel="stylesheet" crossorigin href="/portfolio/assets/index-CzyggMHT.css">
    <link rel="manifest" href="/portfolio/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/portfolio/registerSW.js"></script></head>
    <body>
        <div id="root"></div>

        <!-- Redirect for github pages -->
        <script>
            (function (l) {
                if (l.search[1] === "/") {
                    var decoded = l.search
                        .slice(1)
                        .split("&")
                        .map(function (s) {
                            return s.replace(/~and~/g, "&");
                        })
                        .join("?");
                        
                    window.history.replaceState(
                        null,
                        "",
                        l.pathname.slice(0, -1) + decoded + l.hash,
                    );
                }
            })(window.location);
        </script>

    </body>
</html>
